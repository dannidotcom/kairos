[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-api"
version = "0.1.0"
description = "Kairos — signal-led LinkedIn prospecting"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "httpx>=0.28,<1.0",
  "arq>=0.26,<1.0",
  "redis>=5.2,<7.0",
  "mcp>=1.9,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "orjson>=3.10,<4.0",
  "tzdata>=2024.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
